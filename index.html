<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ESSENTIAL SPACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Unbounded:wght@800&display=swap">
<style>
/* ==========================================================
   CONFIG — semua ukuran mengacu ke lebar screenshot (313px).
   --u = 1 "unit" = 1px pada screenshot; otomatis menskala
   mengikuti lebar layar sampai batas --max-w.
   ========================================================== */
:root {
  color-scheme: light;

  /* warna */
  --black: #000000;
  --white: #FFFFFF;
  --paper: #F7F7F4;          /* off-white background */
  --ink-soft: #1a1a1a;       /* teks footer */

  /* lapisan gelap di belakang teks/search bar, lebar penuh header */
  /* "transparankan 55%" = 55% transparan -> opacity 45% */
  --band-opacity: 0.45;

  /* layout */
  --max-w: 480px;
  --u: calc(min(100vw, var(--max-w)) / 313);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* header */
  --header-h-landing: calc(var(--u) * 88);
  --header-h-search: calc(var(--u) * 78);
  --pattern-pos: center 21%;

  /* logo */
  --font-logo: "Orbitron", "Arial Black", Impact, sans-serif;
  --logo-size: calc(var(--u) * 17);

  /* tombol kategori */
  --font-btn: "Unbounded", "Arial Black", Impact, sans-serif;
  --btn-w: calc(var(--u) * 170);
  --btn-h: calc(var(--u) * 45);
  --btn-gap: calc(var(--u) * 11);
  --btn-font: calc(var(--u) * 9);
  --landing-top-space: calc(var(--u) * 89);

  /* search bar */
  --font-ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --search-w: calc(var(--u) * 202);
  --search-h: calc(var(--u) * 33);
  --search-top: calc(var(--u) * 25);
  --search-font: max(10px, calc(var(--u) * 7));
  --search-icon: calc(var(--u) * 22);

  /* grid produk */
  --grid-side: calc(var(--u) * 16);
  --grid-gap-x: calc(var(--u) * 20);
  --grid-gap-y: calc(var(--u) * 24);
  --grid-top: calc(var(--u) * 15);
  --grid-bottom: calc(var(--u) * 26);

  /* kartu produk */
  --card-border: 1px solid var(--black);
  --card-image-ratio: 127 / 94;
  --card-info-ratio: 127 / 32;

  /* footer */
  --footer-font: max(9px, calc(var(--u) * 9));
  --footer-bottom: calc(var(--u) * 80);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--black);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
#root { min-height: 100dvh; }

.app {
  max-width: var(--max-w);
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--paper);
}

a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid #777; outline-offset: 3px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.header--landing {
  height: calc(var(--header-h-landing) + var(--safe-top));
  padding-top: var(--safe-top);
  align-items: center;
  justify-content: center;
}
.header--search {
  height: calc(var(--header-h-search) + var(--safe-top));
  padding-top: calc(var(--safe-top) + var(--search-top));
  align-items: flex-start;
  justify-content: center;
}

/* pita hitam transparan, lebar penuh header, di belakang teks/search bar */
.header__band {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 0;
  background: var(--black);
  opacity: var(--band-opacity);
  pointer-events: none;
}
.header--landing .header__band {
  top: 0;
  bottom: 0;
}
.header--search .header__band {
  top: 0;
  bottom: 0;
}

/* konten header (logo / search / tombol back) tampil di atas pita */
.header > *:not(.header__band) {
  position: relative;
  z-index: 1;
}

.logo {
  margin: 0;
  font-family: var(--font-logo);
  font-weight: 900;
  font-size: var(--logo-size);
  line-height: 1;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--white);
  white-space: nowrap;
  text-align: center;
}

/* ---------- Search bar ---------- */
.search {
  display: flex;
  align-items: center;
  width: var(--search-w);
  height: var(--search-h);
  padding: 0 calc(var(--u) * 12) 0 calc(var(--u) * 11);
  gap: calc(var(--u) * 9);
  background: var(--black);
  border: 1.5px solid var(--white);
  border-radius: 999px;
  color: var(--white);
}
.search:focus-within { box-shadow: 0 0 0 2px rgba(255, 255, 255, .4); }
.search__icon {
  flex: none;
  width: var(--search-icon);
  height: var(--search-icon);
  display: block;
}
.search__input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  margin: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--white);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: var(--search-font);
  text-overflow: ellipsis;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
}
.search__input::placeholder { color: var(--white); opacity: .92; }

/* ---------- Landing ---------- */
.landing { flex: 0 0 auto; padding-top: var(--landing-top-space); }
.categories {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--btn-gap);
}
.category-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--btn-w);
  height: var(--btn-h);
  border-radius: 999px;
  background: var(--black);
  color: var(--white);
  font-family: var(--font-btn);
  font-weight: 800;
  font-size: var(--btn-font);
  letter-spacing: .02em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ---------- Footer ---------- */
.footer {
  margin-top: auto;
  padding: calc(var(--u) * 60) 0 calc(var(--footer-bottom) + var(--safe-bottom));
  text-align: center;
  font-family: var(--font-ui);
  font-size: var(--footer-font);
  line-height: 1.2;
  color: var(--ink-soft);
}
.footer p { margin: 0; }

/* ---------- Product grid ---------- */
.grid {
  list-style: none;
  margin: 0;
  padding: var(--grid-top) var(--grid-side) calc(var(--grid-bottom) + var(--safe-bottom));
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--grid-gap-x);
  row-gap: var(--grid-gap-y);
  align-items: start;
}
.card { display: block; }
.card__image {
  aspect-ratio: var(--card-image-ratio);
  background: var(--paper);
  border: var(--card-border);
  border-bottom: 0;
  overflow: hidden;
}
.card__image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card__info {
  aspect-ratio: var(--card-info-ratio);
  background: var(--black);
  color: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 calc(var(--u) * 6);
  font-family: var(--font-ui);
  font-size: calc(var(--u) * 7);
  line-height: 1.25;
  overflow: hidden;
}
.card__name, .card__price { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card__price { font-weight: 700; }

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function () {
  "use strict";
  var h = React.createElement;
  var Fragment = React.Fragment;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useMemo = React.useMemo;

  /* ==========================================================
     CONFIG / DATA
     ========================================================== */
  // false = area info hitam dibiarkan kosong seperti screenshot.
  // Ubah ke true jika ingin menampilkan nama & harga produk.
  var SHOW_PRODUCT_TEXT = false;

  var CATEGORIES = [
    { slug: "fashion",     label: "Fashion",       code: "FSH" },
    { slug: "gadget",      label: "Gadget",        code: "GDT" },
    { slug: "home-living", label: "Home & Living", code: "HNL" }
  ];

  var NAMES = {
    fashion: ["Oversized Tee", "Cargo Pants", "Zip Hoodie", "Bucket Hat", "Crossbody Bag", "Canvas Sneakers"],
    gadget: ["Wireless Earbuds", "Smart Watch", "Power Bank", "Mechanical Keyboard", "Bluetooth Speaker", "Phone Stand"],
    "home-living": ["Ceramic Mug", "Table Lamp", "Throw Blanket", "Wall Frame", "Storage Box", "Plant Pot"]
  };
  var PRICES = [89000, 129000, 149000, 199000, 249000, 59000];

  // Dummy data: tidak ada gambar (image: null) agar kartu kosong seperti screenshot.
  var PRODUCTS = [];
  CATEGORIES.forEach(function (c) {
    NAMES[c.slug].forEach(function (name, i) {
      PRODUCTS.push({
        id: c.code + "-" + String(i + 1).padStart(3, "0"),
        number: String(i + 1).padStart(3, "0"),
        category: c.slug,
        name: name,
        price: PRICES[i],
        image: null
      });
    });
  });

  function formatPrice(n) {
    return "Rp " + n.toLocaleString("id-ID");
  }

  /* ==========================================================
     COMPONENTS
     ========================================================== */

  function HeaderPattern(props) {
    return h("header", { className: "header header--" + props.variant },
      h("div", { className: "header__band", "aria-hidden": "true" }),
      props.children
    );
  }


  function SearchBar(props) {
    return h("div", { className: "search", role: "search" },
      h("svg", {
        className: "search__icon", viewBox: "0 0 24 24", fill: "none",
        stroke: "#fff", strokeWidth: 2.1, strokeLinecap: "round", "aria-hidden": "true"
      },
        h("circle", { cx: 10.5, cy: 10.5, r: 7.6 }),
        h("line", { x1: 16.2, y1: 16.2, x2: 22, y2: 22 })
      ),
      h("input", {
        className: "search__input",
        type: "text",
        inputMode: "search",
        enterKeyHint: "search",
        autoComplete: "off",
        autoCorrect: "off",
        spellCheck: false,
        placeholder: "kolom pencarian nomor...",
        "aria-label": "Cari produk berdasarkan nomor atau nama",
        value: props.value,
        onChange: function (e) { props.onChange(e.target.value); }
      })
    );
  }

  function CategoryButton(props) {
    return h("a", { className: "category-btn", href: "#/" + props.slug }, props.label);
  }

  function ProductCard(props) {
    var p = props.product;
    return h("li", { className: "card" },
      h("div", { className: "card__image" },
        p.image ? h("img", { src: p.image, alt: p.name }) : null
      ),
      h("div", { className: "card__info" },
        SHOW_PRODUCT_TEXT ? h(Fragment, null,
          h("p", { className: "card__name" }, p.name),
          h("p", { className: "card__price" }, formatPrice(p.price))
        ) : null
      )
    );
  }

  function ProductGrid(props) {
    return h("main", null,
      h("ul", { className: "grid" },
        props.products.map(function (p) { return h(ProductCard, { key: p.id, product: p }); })
      )
    );
  }

  function Footer() {
    return h("footer", { className: "footer" }, h("p", null, "@EssentialSpace 2026"));
  }

  /* ==========================================================
     PAGES
     ========================================================== */

  function LandingPage() {
    return h(Fragment, null,
      h(HeaderPattern, { variant: "landing" },
        h("h1", { className: "logo" }, "ESSENTIAL SPACE")
      ),
      h("main", { className: "landing" },
        h("nav", { className: "categories", "aria-label": "Kategori" },
          CATEGORIES.map(function (c) {
            return h(CategoryButton, { key: c.slug, slug: c.slug, label: c.label });
          })
        )
      ),
      h(Footer)
    );
  }

  function SearchPage(props) {
    var category = props.category;
    var st = useState("");
    var query = st[0], setQuery = st[1];

    var results = useMemo(function () {
      var q = query.trim().toLowerCase();
      return PRODUCTS.filter(function (p) {
        if (p.category !== category.slug) return false;
        if (!q) return true;
        return (p.id + " " + p.number + " " + p.name).toLowerCase().indexOf(q) !== -1;
      });
    }, [query, category.slug]);

    return h(Fragment, null,
      h(HeaderPattern, { variant: "search" },
        h("h1", { className: "sr-only" }, "ESSENTIAL SPACE — " + category.label),
        h(SearchBar, { value: query, onChange: setQuery })
      ),
      h(ProductGrid, { products: results }),
      h("p", { className: "sr-only", "aria-live": "polite" },
        results.length === 0 ? "Produk tidak ditemukan" : "")
    );
  }

  /* ==========================================================
     APP + hash router  (#/  ,  #/fashion  ,  #/gadget  ,  #/home-living)
     ========================================================== */

  function useHashRoute() {
    var st = useState(window.location.hash);
    var hash = st[0], setHash = st[1];
    useEffect(function () {
      function onChange() { setHash(window.location.hash); }
      window.addEventListener("hashchange", onChange);
      return function () { window.removeEventListener("hashchange", onChange); };
    }, []);
    return hash.replace(/^#\/?/, "");
  }

  function App() {
    var slug = useHashRoute();
    var category = CATEGORIES.filter(function (c) { return c.slug === slug; })[0];

    useEffect(function () { window.scrollTo(0, 0); }, [slug]);

    return h("div", { className: "app" },
      category
        ? h(SearchPage, { key: category.slug, category: category })
        : h(LandingPage)
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
